[package]
name = "mongo-es"
version = "0.4.2"
authors = ["daniel-mader"]
description = "A MongoDB implementation of the cqrs-es event store."
edition = "2021"
repository = "https://github.com/impierce/mongo-es"
license = "Apache-2.0"
keywords = ["cqrs", "event-sourcing", "mongodb", "cqrs-es"]
include = ["/src", "/CHANGELOG.md", "/README.md", "/LICENSE"]

[dependencies]
cqrs-es = "0.5.0"

futures = "0.3"
log = "0.4"
mongodb = "3.7"
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.52", features = ["rt"] }

[dev-dependencies]
testcontainers-modules = "0.15"
tokio = { version = "1.52", features = ["macros", "rt"] }
uuid = { version = "1.23", features = ["v4"] }
