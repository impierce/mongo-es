[package]
name = "mongo-es"
version = "0.4.0"
authors = ["daniel-mader"]
description = "A MongoDB implementation of the cqrs-es event store."
edition = "2021"
repository = "https://github.com/impierce/mongo-es"
license = "Apache-2.0"
keywords = ["cqrs", "event-sourcing", "mongodb", "cqrs-es"]

[dependencies]
cqrs-es = "0.5.0"

futures = "0.3"
log = "0.4"
mongodb = "3.2"
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.43" }

[dev-dependencies]
testcontainers-modules = { version = "0.12", features = ["mongo"] }
uuid = { version = "1.17", features = ["v4"] }
